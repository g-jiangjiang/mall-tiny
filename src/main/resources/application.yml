server:
  port: 8080

spring:
  application:
    name: mall-tiny
  profiles:
    active: dev
#  main:
#    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    auto-mapping-behavior: partial
    map-underscore-to-camel-case: true

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-admin-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

redis:
  database: mall
  key:
    admin: 'ums:admin'
    resourceList: 'ums:resourceList'
    loginFail: 'ums:loginFail'
    loginLock: 'ums:loginLock'
    userToken: 'ums:userToken'
  expire:
    common: 86400 # 24小时
    loginFail: 600 # 10分钟
    loginLock: 1800 # 30分钟

login:
  maxFailAttempts: 5 # 最大登录失败次数
  lockDuration: 30 # 锁定时间（分钟）
  failWindow: 10 # 失败统计时间窗口（分钟）

secure:
  ignored:
    urls: #安全路径白名单
      - /
      - /swagger-ui.html
      - /swagger-ui/
      - /*.html
      - /favicon.ico
      - /**/*.html
      - /**/*.css
      - /**/*.js
      - /swagger-resources/**
      - /v3/api-docs/**
      - /actuator/**
      - /druid/**
      - /admin/login
      - /admin/register
      - /admin/info
      - /admin/logout
